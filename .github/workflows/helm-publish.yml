name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/codesys-pod

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          mkdir -p .deploy
          helm package charts/codesys-pod -d .deploy
          # Current-version-only index: do NOT merge the live index. Merging
          # carried forward (a) stale codesys-pod versions and (b) the dead
          # codesys-control-sl 1.0.x entries whose tarballs 404 — the chart was
          # renamed in place, so --merge kept resurrecting the old name forever.
          # Prior chart versions predate the App Store contract and must not be
          # resolvable. Rebuild index.yaml from .deploy alone (just this build).
          helm repo index .deploy --url https://embernet-ai.github.io/Codesys-AMD-64-x86/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          keep_files: true
