name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'icon.png'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint every chart
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for c in charts/*/Chart.yaml; do
            d=$(dirname "$c")
            echo "::group::helm lint $d"
            helm lint "$d"
            echo "::endgroup::"
            found=1
          done
          [ "$found" = "1" ] || { echo "no charts found under charts/"; exit 1; }

      # The naming standard, enforced rather than remembered: chart directory,
      # Chart.yaml name, and the release-name annotation are the vendor's
      # official product name and must agree. This chart was `codesys-pod`,
      # then `codesys-app`, and neither named the product, which is how UT3's
      # values file ended up pointing at a chart that no longer existed.
      - name: Chart name matches directory and release-name annotation
        run: |
          set -euo pipefail
          rc=0
          for c in charts/*/Chart.yaml; do
            d=$(basename "$(dirname "$c")")
            n=$(grep -E '^name:' "$c" | head -1 | sed 's/^name:[[:space:]]*//')
            r=$(grep -E 'catalog.cattle.io/release-name:' "$c" | head -1 | sed 's/.*release-name:[[:space:]]*//' | tr -d '"')
            if [ "$d" != "$n" ]; then
              echo "::error file=$c::directory '$d' does not match chart name '$n'"; rc=1
            fi
            if [ -n "$r" ] && [ "$r" != "$n" ]; then
              echo "::error file=$c::release-name annotation '$r' does not match chart name '$n'"; rc=1
            fi
          done
          exit $rc

      # These templates render a container command run by /bin/sh. A carriage
      # return on an executable line is read as part of the last token, so a
      # path assignment carries a trailing CR and every later reference misses,
      # silently. Counts CR bytes with tr rather than matching with grep,
      # because `grep -lIU $'\r'` returns false positives under Git Bash, which
      # is where anyone hand-packaging would run this check.
      - name: No CRLF in chart files
        run: |
          set -euo pipefail
          bad=""
          while IFS= read -r f; do
            [ "$(tr -cd '\r' < "$f" | wc -c)" -eq 0 ] || bad="${bad}${f}"$'\n'
          done < <(find charts -type f)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in chart files"
            printf '%s' "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo "all chart files are LF"

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .deploy
          for c in charts/*/Chart.yaml; do
            helm package "$(dirname "$c")" -d .deploy
          done

      # Still NOT `helm repo index --merge`. Merging trusts the old index, which
      # is how stale codesys-pod versions and dead codesys-control-sl 1.0.x
      # entries whose tarballs 404 kept coming back. Prior chart VERSIONS
      # predate the App Store contract and must not be resolvable.
      #
      # A chart RENAME breaks differently, and that difference cost an outage.
      # Rebuilding from chart directories alone means a renamed chart's old NAME
      # disappears from index.yaml while keep_files: true leaves its tarball on
      # gh-pages returning 200. Anything resolving the old name then fails with
      # "chart not found" while the file sits right there. On 2026-09-26 that
      # broke codesys-automation-server/fleet/deploy-vplc-fleet.sh, which pins
      # CHART="codesys-control-sl/codesys-app" for the 25-release Fragua vPLC
      # fleet.
      #
      # charts/LEGACY-RETAINED.txt is the narrow fix: an explicit, shrinking
      # list of already-published tarballs that must stay resolvable by name for
      # a deprecation window. Explicit beats --merge because it names what it is
      # keeping and why, and it cannot resurrect anything nobody asked for.
      - name: Retain legacy chart names listed in charts/LEGACY-RETAINED.txt
        run: |
          set -euo pipefail
          LIST=charts/LEGACY-RETAINED.txt
          [ -f "$LIST" ] || { echo "no legacy list, nothing to retain"; exit 0; }
          BASE=https://embernet-ai.github.io/Codesys-AMD-64-x86
          rc=0
          while read -r line; do
            f="${line%%#*}"; f="$(echo "$f" | tr -d '[:space:]')"
            [ -n "$f" ] || continue
            code=$(curl -sS -o ".deploy/$f" -w "%{http_code}" "$BASE/$f" || echo 000)
            if [ "$code" != "200" ]; then
              # Hard error, not a skip. A listed-but-absent tarball is exactly
              # the 404 this policy exists to prevent.
              echo "::error file=$LIST::$f is listed for retention but $BASE/$f returned $code"
              rm -f ".deploy/$f"
              rc=1
            else
              echo "retained $f"
            fi
          done < "$LIST"
          exit $rc

      - name: Build index from everything being published
        run: |
          set -euo pipefail
          # Indexes .deploy, which now holds the freshly packaged charts plus any
          # retained legacy tarballs. Index and files therefore agree by
          # construction, which is the property that prevents a 404.
          helm repo index .deploy --url https://embernet-ai.github.io/Codesys-AMD-64-x86/
          echo "--- entries ---"
          grep -E "^  [a-z][a-z0-9-]*:$" .deploy/index.yaml

      # Chart.yaml icon and the app-icon annotation point at
      # https://embernet-ai.github.io/Codesys-AMD-64-x86/icon.png. The store
      # renders icons with crossorigin=anonymous and github.io sends CORS, so
      # the logo is served from this repo's own Pages, next to the index that
      # names it. Missing is a hard error: a chart pointing at a 404 icon shows
      # a blank card.
      - name: Publish the chart icon
        run: |
          set -euo pipefail
          [ -f icon.png ] || { echo "::error::icon.png missing; Chart.yaml icon would 404"; exit 1; }
          cp icon.png .deploy/icon.png

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          keep_files: true
