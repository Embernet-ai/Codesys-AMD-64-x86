apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codesys-app.fullname" . }}
  labels:
    {{- include "codesys-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  # Recreate strategy is REQUIRED when using hostNetwork + RWO PVC node affinity.
  # RollingUpdate creates an unbreakable scheduling deadlock: new pod can't start
  # because old pod holds the host ports on the only eligible node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "codesys-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codesys-app.selectorLabels" . | nindent 8 }}
        {{- include "codesys-app.storeLabels" . | nindent 8 }}
        # app label = registered Flux service name (spec §7 cross-site launch)
        app: {{ .Release.Name | quote }}
        {{- with .Values.tenantLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.sidecarProxy.enabled }}
        checksum/sidecar-proxy: {{ include (print $.Template.BasePath "/configmap-sidecar-proxy.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.embernet }}{{- if .displayName }}
        embernet.ai/display-name: {{ .displayName | quote }}
        {{- end }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}

      initContainers:
        # The CODESYS Control SL runtime is baked into the prebuilt image
        # (ghcr.io/embernet-ai/codesys-sl); no download/dpkg at pod start. Its
        # working dir /var/opt/codesys ships a few files (the CodeMeter
        # SoftContainer demo license + bacstac.ini). Mounting the persistence
        # PVC straight over /var/opt/codesys would MASK them, so seed the PVC
        # from the image on first run. The PVC is mounted HERE at /seed (NOT at
        # /var/opt/codesys), so the image's baked dir stays visible; `cp -an`
        # copies it in once and never clobbers persisted PLC app / retain data
        # on later restarts.
        - name: seed-workdir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              cp -an /var/opt/codesys/. /seed/ 2>/dev/null || true
              echo "Seeded persistence from image. Contents of /seed:"
              ls -la /seed
          volumeMounts:
            - name: data
              mountPath: /seed

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command: the image ENTRYPOINT runs the runtime verbatim from the
          # .deb's own init script:
          #   cd /var/opt/codesys
          #   /opt/codesys/bin/codesyscontrol.bin /etc/codesyscontrol/CODESYSControl.cfg
          ports:
            - name: runtime
              containerPort: {{ .Values.service.ports.runtime }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.service.ports.runtime }}
              {{- end }}
            - name: gateway
              containerPort: {{ .Values.service.ports.gateway }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.service.ports.gateway }}
              {{- end }}
            - name: opcua
              containerPort: {{ .Values.service.ports.opcua }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.service.ports.opcua }}
              {{- end }}
            - name: webvisu
              containerPort: {{ .Values.service.ports.webvisu }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.service.ports.webvisu }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.path }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        # ── Sidecar Reverse Proxy (MUST be last container) ──────────────
        {{- if .Values.sidecarProxy.enabled }}
        - name: sidecar-proxy
          image: "{{ .Values.sidecarProxy.image.repository }}:{{ .Values.sidecarProxy.image.tag }}"
          imagePullPolicy: {{ .Values.sidecarProxy.image.pullPolicy }}
          ports:
            - name: proxy-http
              containerPort: {{ .Values.sidecarProxy.listenPort }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.sidecarProxy.listenPort }}
              {{- end }}
          volumeMounts:
            - name: sidecar-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: sidecar-proxy-tmp
              mountPath: /tmp
            - name: sidecar-proxy-cache
              mountPath: /var/cache/nginx
            - name: sidecar-proxy-run
              mountPath: /var/run
          resources:
            {{- toYaml .Values.sidecarProxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sidecarProxy.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
        {{- end }}

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "codesys-app.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.sidecarProxy.enabled }}
        - name: sidecar-proxy-config
          configMap:
            name: {{ include "codesys-app.fullname" . }}-sidecar-proxy
        - name: sidecar-proxy-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: sidecar-proxy-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: sidecar-proxy-run
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
