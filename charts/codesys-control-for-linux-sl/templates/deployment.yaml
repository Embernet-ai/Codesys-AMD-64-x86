apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codesys-control-for-linux-sl.fullname" . }}
  labels:
    {{- include "codesys-control-for-linux-sl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  # Recreate strategy is REQUIRED when using hostNetwork + RWO PVC node affinity.
  # RollingUpdate creates an unbreakable scheduling deadlock: new pod can't start
  # because old pod holds the host ports on the only eligible node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "codesys-control-for-linux-sl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codesys-control-for-linux-sl.selectorLabels" . | nindent 8 }}
        {{- include "codesys-control-for-linux-sl.storeLabels" . | nindent 8 }}
        # app label = registered Flux service name (spec §7 cross-site launch)
        app: {{ .Release.Name | quote }}
        {{- with .Values.tenantLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.sidecarProxy.enabled }}
        checksum/sidecar-proxy: {{ include (print $.Template.BasePath "/configmap-sidecar-proxy.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.embernet }}{{- if .displayName }}
        embernet.ai/display-name: {{ .displayName | quote }}
        {{- end }}{{- end }}
        # Deployed tile icon; the dashboard reads the pod first, then the Service.
        embernet.ai/app-icon: {{ .Chart.Icon | quote }}
    spec:
      {{- $hp := include "codesys-control-for-linux-sl.hostPorts" . | fromJson }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}

      initContainers:
        # The CODESYS Control SL runtime is baked into the prebuilt image
        # (ghcr.io/embernet-ai/codesys-sl); no download/dpkg at pod start. Its
        # working dir /var/opt/codesys ships a few files (the CodeMeter
        # SoftContainer demo license + bacstac.ini). Mounting the persistence
        # PVC straight over /var/opt/codesys would MASK them, so seed the PVC
        # from the image on first run. The PVC is mounted HERE at /seed (NOT at
        # /var/opt/codesys), so the image's baked dir stays visible; `cp -an`
        # copies it in once and never clobbers persisted PLC app / retain data
        # on later restarts.
        - name: seed-workdir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              cp -an /var/opt/codesys/. /seed/ 2>/dev/null || true
              echo "Seeded persistence from image. Contents of /seed:"
              ls -la /seed
          volumeMounts:
            - name: data
              mountPath: /seed

      containers:
        # Container name comes from the .name helper, not .Chart.Name directly,
        # so nameOverride controls it too. That is what lets a release created
        # under the old chart name upgrade to this one with
        # `nameOverride: codesys-app` and keep byte-identical object AND
        # container names, which in turn keeps `kubectl exec -c codesys-app`
        # and anything else pinned to that name working.
        - name: {{ include "codesys-control-for-linux-sl.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.runtimeConfig.registerBootApplication .Values.runtimeConfig.disableUserMgmtEnforce $hp }}
          # Runtime config bootstrap.
          #
          # /etc/codesyscontrol/ lives in the IMAGE, not on the PVC, and an
          # unlicensed runtime restarts roughly every two hours, so anything
          # edited inside a running container is gone by the next cycle. The
          # edits have to be re-applied at every start, which is why this is a
          # command rather than an init container writing a file once.
          #
          # This once existed on a site's stations only as a hand-applied
          # `kubectl patch`, two Deployment revisions ahead of the Helm
          # release. That is drift with teeth: the next `helm upgrade` reverts
          # the Deployment to the chart, both lines disappear, and the station
          # goes dark in a way that logs almost nothing. Owning it here is the
          # fix that deployment's own runbook asked for and never got.
          #
          # Both edits are guarded by grep, so restarts and re-applies are safe.
          #
          # Each setting goes INTO its section when the file already has one,
          # and gets a new section only when it does not. The 4.22 image ships
          # both [CmpApp] and [CmpUserMgr], and the runtime reads only the first
          # copy of a section: 2.0.3 appended a second [CmpApp] and a live
          # station came up "CODESYS Control ready" with no application at all.
          # The first version had the opposite hole, inserting only when the
          # section existed and doing nothing otherwise. It also exec'd
          # codesyscontrol.bin directly, which skipped the image's entrypoint.sh
          # (no pre_start.sh, no LD_LIBRARY_PATH, no PRODUCT); handing off to
          # the entrypoint keeps the 4.22 launch contract as the image ships it.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CFG=/etc/codesyscontrol/CODESYSControl_User.cfg
              # ensure SECTION KEY=VALUE: exactly one line, inside the first copy
              # of SECTION.
              ensure() {
                grep -q "^$2\$" "$CFG" && return 0
                if grep -q "^\[$1\]" "$CFG"; then
                  sed -i "0,/^\[$1\]/s//[$1]\n$2/" "$CFG"
                else
                  printf '\n[%s]\n%s\n' "$1" "$2" >> "$CFG"
                fi
              }
              {{- if .Values.runtimeConfig.registerBootApplication }}
              # A boot application copied into PlcLogic/Application/ is NEVER
              # loaded unless it is listed here. A download from the IDE
              # registers it; a file copy does not, and the runtime then starts
              # with no application and says nothing about a bootproject. Only
              # registered when the file is actually there.
              if [ -f /var/opt/codesys/PlcLogic/Application/Application.app ]; then
                ensure CmpApp Application.1=Application
              fi
              {{- end }}
              {{- if .Values.runtimeConfig.disableUserMgmtEnforce }}
              # The station image ships UserLogin_AuthenticationType=ONLY_ASYMMETRIC
              # with an EMPTY user database. The OPC UA server then advertises a
              # single anonymous endpoint and answers ActivateSession with
              # BadUserAccessDenied, so no client can ever read the station.
              ensure CmpUserMgr SECURITY.UserMgmtEnforce=NO
              {{- end }}
              {{- if $hp }}
              # network.hostPorts / network.udpPortIndex: under hostNetwork the
              # runtime's own sockets ARE the node's, so it has to listen where
              # the hostPort says. Keys proven on codesys-control-sl:4.22.0.0 by
              # moving each port and watching ss: CmpBlkDrvTcp ListenPort,
              # CmpOPCUAServer NetworkPort, CmpBlkDrvUdp DefaultPortIndex.
              {{- include "codesys.setkey" . | nindent 14 }}
              {{- with $hp.runtime }}
              setkey "$CFG" CmpBlkDrvTcp ListenPort {{ . }}
              {{- end }}
              {{- with $hp.opcua }}
              setkey "$CFG" CmpOPCUAServer NetworkPort {{ . }}
              {{- end }}
              {{- with $hp.udpPortIndex }}
              setkey "$CFG" CmpBlkDrvUdp DefaultPortIndex {{ . }}
              {{- end }}
              {{- end }}
              exec /usr/local/bin/entrypoint.sh
          {{- else }}
          # No command: the image ENTRYPOINT runs the runtime verbatim from the
          # .deb's own init script:
          #   cd /var/opt/codesys
          #   /opt/codesys/bin/codesyscontrol.bin /etc/codesyscontrol/CODESYSControl.cfg
          {{- end }}
          ports:
            - name: runtime
              containerPort: {{ $hp.runtime | default .Values.service.ports.runtime }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ $hp.runtime | default .Values.service.ports.runtime }}
              {{- end }}
            - name: gateway
              containerPort: {{ $hp.gateway | default .Values.service.ports.gateway }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ $hp.gateway | default .Values.service.ports.gateway }}
              {{- end }}
            - name: opcua
              containerPort: {{ $hp.opcua | default .Values.service.ports.opcua }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ $hp.opcua | default .Values.service.ports.opcua }}
              {{- end }}
            - name: webvisu
              containerPort: {{ .Values.service.ports.webvisu }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.service.ports.webvisu }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.path }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        # ── Sidecar Reverse Proxy (MUST be last container) ──────────────
        {{- if .Values.sidecarProxy.enabled }}
        - name: sidecar-proxy
          image: "{{ .Values.sidecarProxy.image.repository }}:{{ .Values.sidecarProxy.image.tag }}"
          imagePullPolicy: {{ .Values.sidecarProxy.image.pullPolicy }}
          ports:
            - name: proxy-http
              containerPort: {{ .Values.sidecarProxy.listenPort }}
              protocol: TCP
              {{- if .Values.network.hostNetwork }}
              hostPort: {{ .Values.sidecarProxy.listenPort }}
              {{- end }}
          volumeMounts:
            - name: sidecar-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: sidecar-proxy-tmp
              mountPath: /tmp
            - name: sidecar-proxy-cache
              mountPath: /var/cache/nginx
            - name: sidecar-proxy-run
              mountPath: /var/run
          resources:
            {{- toYaml .Values.sidecarProxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sidecarProxy.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /sidecar-health
              port: {{ .Values.sidecarProxy.listenPort }}
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
        {{- end }}

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "codesys-control-for-linux-sl.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.sidecarProxy.enabled }}
        - name: sidecar-proxy-config
          configMap:
            name: {{ include "codesys-control-for-linux-sl.fullname" . }}-sidecar-proxy
        - name: sidecar-proxy-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: sidecar-proxy-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: sidecar-proxy-run
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
