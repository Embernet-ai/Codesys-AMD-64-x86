# =============================================================================
# CODESYS Control SL (AMD64/x86) — Default Configuration
# =============================================================================
# EmberNET Industrial Dashboard — Helm Chart Values
# Fireball Industries — https://embernet.ai
# =============================================================================

# ==================== Upgrading from chart `codesys-app` ====================
# This chart was called `codesys-app` up to 1.6.0. The name is now the vendor's
# official product name, because a release should say which product it is
# running, and `codesys-app` named neither the product nor the architecture.
#
# THE NAME FEEDS OBJECT NAMES. Deployment, Service and PVC are all derived from
# it, so upgrading an existing release onto this chart without care renames the
# PVC, and a renamed PVC means the runtime comes up against empty storage with
# NO BOOT APPLICATION. On a tester that is a station that runs nothing.
#
# So for any release created under the old name, pin:
#
#     nameOverride: codesys-app
#
# That keeps the object names, the container name, and therefore the PVC
# byte-identical, and the upgrade is an ordinary rolling restart. Verified
# against two live stations.
#
# Drop the override only when you are deliberately migrating the data, which
# means: back up /var/opt/codesys, upgrade without it, then restore. Do not do
# that on a station mid-run.
#
# New installs set nothing and get the correct names from the start.
nameOverride: ""
fullnameOverride: ""

# ==================== Dashboard-injected values ====================
# The dashboard's App Store deploy path stamps these in. The chart is
# responsible for rendering them onto BOTH the pod template and the Service.
# tenantLabels carries embernet.ai/tenant — without it on the Service the app
# is invisible to every tenant-scoped view (visible to SuperAdmin only). See
# App Store chart spec §2. Safe to leave empty for a manual local install.
embernet:
  displayName: ""       # -> embernet.ai/display-name annotation
tenantLabels: {}        # -> e.g. { embernet.ai/tenant: acme, embernet.ai/deployed-by: user }

# ==================== Container Image ====================
# Prebuilt image: the CODESYS Control SL .deb (+ dependency shims) is installed
# at BUILD time, so there is no download/unzip/dpkg at pod start (~90s -> ~3s).
# A seed initContainer copies the image's baked /var/opt/codesys into the
# persistence PVC on first run (see deployment.yaml).
#
# NOW BUILT BY Embernet-ai/codesys-packages, not this repo's build-image.yml.
# That workflow fetches the .package with an unauthenticated curl, which only
# works against a public release — the 4.22.0.0 assets are on codesys-packages,
# which is private, so it 404s. (Its default URL also still points at
# codesys-linux-x86, a repo that no longer exists.) A workflow running inside
# codesys-packages reads its own private release with the built-in
# GITHUB_TOKEN, so that is where the image is produced.
#
# 4.22 is not a drop-in rebuild of 4.20: its .deb adds `Depends: systemd
# (>= 240)` and ships a systemd unit in place of /etc/init.d/codesyscontrol.
# See codesys-packages' Dockerfile + entrypoint.sh for how that is handled.
#
# tag is pinned rather than left to Chart.appVersion so a chart-only version
# bump can never silently move the runtime.
image:
  repository: ghcr.io/embernet-ai/codesys-control-sl
  pullPolicy: IfNotPresent
  tag: "4.22.0.0"

# ==================== Image Pull Secrets ====================
imagePullSecrets: []

# ==================== Replica Count ====================
replicaCount: 1

# ==================== Resource Limits ====================
resources:
  # PLC runtimes are real-time critical — do not under-provision
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ==================== Service ====================
service:
  type: ClusterIP
  port: 8080
  ports:
    runtime: 11740      # CODESYS Control SL runtime/device port, the IDE connects here
    # gateway is INERT as of 2.2.0 and renders nowhere: not on the Service, not
    # as a containerPort, not as a hostPort. The runtime ships no gateway and
    # never binds 1217, and declaring it under hostNetwork made the scheduler
    # reserve the node's 1217, which kept a real Edge Gateway off the node
    # entirely. The key stays so an existing values file still parses and still
    # means what it always did, which is nothing. Run
    # codesys-edge-gateway-for-linux for a gateway that actually listens.
    gateway: 1217
    opcua: 4840
    webvisu: 8080

# ==================== Node Selector ====================
# Injected by the Industrial Dashboard when deploying to specific nodes
nodeSelector: {}

# ==================== Tolerations ====================
tolerations: []

# ==================== Affinity ====================
affinity: {}

# ==================== GUI (Industrial Dashboard Discovery) ====================
gui:
  enabled: true
  port: 8080
  type: "web"
  displayName: "CODESYS Control SL (AMD64)"

# ==================== Persistence ====================
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  path: /var/opt/codesys

# ==================== Network ====================
network:
  # Default OFF so multiple CODESYS instances can run on ONE edge node.
  # hostNetwork+hostPort binds the node's real 4840/8080/11740/1217 — a second
  # instance on the same node then fails to schedule on the port conflict, which
  # is what actually blocked multi-instance (independent of the Service-naming
  # bug). With hostNetwork off each instance gets its own pod IP + ClusterIP,
  # and the reconciler exposes that ClusterIP over the Flux mesh (host config
  # already targets the ClusterIP, not the node IP). Ignition reaches OPC-UA at
  # <release>.<ns>.svc.cluster.local:4840. Set true ONLY for a single-instance
  # node that needs raw host-IP access and accept it cannot be scaled per node.
  hostNetwork: false
  extraPorts: []
  # Where each socket sits on the NODE when hostNetwork is on, so a second
  # runtime can share the node without a port fight. Empty keeps the port in
  # service.ports, which is exactly what this chart has always done. Ignored
  # when hostNetwork is off, because then the pod has its own network.
  #
  # Kubernetes wants hostPort == containerPort under hostNetwork, so moving a
  # host port only works if the runtime moves with it. The chart does that by
  # writing CODESYSControl_User.cfg at start (the runtimeConfig script). The
  # Service keeps its ports, so in-cluster clients see no change. Each key was
  # proven on codesys-control-sl:4.22.0.0 by setting it and watching ss:
  #
  #   runtime  [CmpBlkDrvTcp] ListenPort       the IDE connects here
  #   opcua    [CmpOPCUAServer] NetworkPort
  #   gateway  INERT as of 2.2.0. It used to move the phantom 1217 declaration
  #            out of the way so an Edge Gateway could schedule beside the
  #            runtime. 2.2.0 stops declaring 1217 at all, which fixes that
  #            properly instead of making every operator know the workaround.
  #            The key stays so existing values files keep parsing.
  #
  # webvisu (8080) is deliberately not here. The web server only starts with a
  # WebVisu application running, and its port key could not be proven, so a
  # knob for it would be a guess.
  hostPorts:
    runtime: ""
    gateway: ""
    opcua: ""
  # The runtime also binds UDP 1740 (+index) for discovery, and never declares
  # it, so the scheduler cannot see a clash there: two hostNetwork runtimes both
  # want 1740 and the second loses it. [CmpBlkDrvUdp] DefaultPortIndex picks
  # 1740 + 0..3 and nothing else is possible (the Edge Gateway ships index 3).
  # Empty keeps the image default, 0.
  udpPortIndex: ""

# ==================== Security Context ====================
securityContext:
  # CODESYS requires privileged access for hardware and networking, and unlike
  # most claims of that shape this one is measurable. On a live CODESYS runtime
  # pod: CapEff is 000001ffffffffff — the FULL capability set — and the
  # container sees the host's entire /dev (dri, drm_dp_aux0, bsg, cpu,
  # dma_heap, autofs...). A runtime that drives fieldbus hardware needs device
  # nodes, and no capability list grants /dev access.
  #
  # templates/app/README.md prefers explicit capabilities over privileged, and
  # that preference is right for workloads whose need is purely network-level.
  # It is wrong here: swapping this for NET_ADMIN/NET_RAW/NET_BIND_SERVICE
  # would cut the hardware path while looking like a tightening.
  #
  # app-invariants: allow-privileged — PLC runtime needs host device nodes,
  # which no capability list can grant.
  privileged: true
  # Redundant while privileged is true, which already implies it. Kept explicit
  # so that dropping privileged later does not silently change this too.
  allowPrivilegeEscalation: true

# ==================== Sidecar Proxy ====================
# URL-rewriting reverse proxy for Industrial Dashboard SPA integration.
# CODESYS WebVisu is a simple server-rendered HTML5 HMI — sidecar is
# NOT needed by default. Enable only if WebVisu assets break through proxy.
sidecarProxy:
  enabled: false
  image:
    repository: "nginxinc/nginx-unprivileged"
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  listenPort: 8081
  upstream:
    port: 8080
  proxyBasePath: "/"
  nginx:
    workerProcesses: "auto"
    workerConnections: 256
    clientMaxBodySize: "10m"
    logLevel: "warn"
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ==================== Runtime Config Bootstrap ====================
# Edits applied to /etc/codesyscontrol/CODESYSControl_User.cfg at every
# container start. That file is in the IMAGE, not on the PVC, and an unlicensed
# runtime restarts about every two hours, so an edit made inside a running
# container does not survive the next cycle.
#
# BOTH DEFAULT OFF, deliberately, because neither is right for every station:
#
#   registerBootApplication  Only needed when the boot application is PUT there
#                            by a file copy, which is how a station gets a
#                            release synced from object storage. A download from the CODESYS IDE
#                            registers the application itself, so a station that
#                            is always loaded from the IDE does not want this.
#
#   disableUserMgmtEnforce   This turns OFF device user management enforcement.
#                            It is the difference between an Ignition gateway
#                            being able to read the tester and every OPC UA
#                            session being refused with BadUserAccessDenied, but
#                            it is a security control being switched off, so it
#                            is opt in per station and belongs only on a plant
#                            network. The alternative is granting the implicit
#                            Anonymous_OPCUAServer group its rights from the IDE.
#
# A station loaded by file copy and read by an Ignition gateway needs both true.
# They were once applied by hand with kubectl patch and were never in the chart,
# which left the live Deployment two revisions ahead of the Helm release and one
# upgrade away from going dark.
runtimeConfig:
  registerBootApplication: false
  disableUserMgmtEnforce: false

# ==================== Environment Variables ====================
env: []

# ==================== Environment From ====================
envFrom: []

# ==================== App-Specific Config ====================
config: {}
